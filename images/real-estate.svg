<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="gold4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2d574"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid4" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="url(#bg4)"/>
  <rect width="600" height="400" fill="url(#grid4)"/>
  <rect width="600" height="400" fill="url(#glow4)"/>

  <!-- skyline -->
  <g stroke="#4a4a4f" stroke-width="2" fill="none">
    <rect x="140" y="150" width="46" height="120"/>
    <rect x="420" y="130" width="46" height="140"/>
  </g>
  <g fill="#2c2c30">
    <rect x="150" y="164" width="10" height="10"/><rect x="168" y="164" width="10" height="10"/>
    <rect x="150" y="186" width="10" height="10"/><rect x="168" y="186" width="10" height="10"/>
    <rect x="150" y="208" width="10" height="10"/><rect x="168" y="208" width="10" height="10"/>
    <rect x="430" y="146" width="10" height="10"/><rect x="448" y="146" width="10" height="10"/>
    <rect x="430" y="168" width="10" height="10"/><rect x="448" y="168" width="10" height="10"/>
    <rect x="430" y="190" width="10" height="10"/><rect x="448" y="190" width="10" height="10"/>
  </g>

  <!-- central house -->
  <g transform="translate(300,205)">
    <path d="M-70 0 L0 -58 L70 0" fill="none" stroke="url(#gold4)" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="-52" y="0" width="104" height="65" fill="none" stroke="url(#gold4)" stroke-width="4.5"/>
    <rect x="-16" y="26" width="32" height="39" fill="none" stroke="url(#gold4)" stroke-width="3.5"/>
    <rect x="-38" y="14" width="16" height="16" fill="none" stroke="#8f8f94" stroke-width="2.5"/>
    <rect x="22" y="14" width="16" height="16" fill="none" stroke="#8f8f94" stroke-width="2.5"/>
  </g>

  <!-- location pin -->
  <g transform="translate(300,90)">
    <path d="M0 0 C13 0 22 9 22 21 C22 36 0 56 0 56 C0 56 -22 36 -22 21 C-22 9 -13 0 0 0 Z"
          fill="none" stroke="url(#gold4)" stroke-width="3.5"/>
    <circle cx="0" cy="20" r="7" fill="url(#gold4)"/>
  </g>

  <line x1="130" y1="300" x2="470" y2="300" stroke="#26262a" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="300" y="340" text-anchor="middle" font-family="Poppins, sans-serif" font-size="15" letter-spacing="4"
        fill="#d4af37" opacity="0.85">LISTINGS · BOOKING · PAYMENTS</text>
</svg>
