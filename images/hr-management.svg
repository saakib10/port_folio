<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2d574"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="url(#bg2)"/>
  <rect width="600" height="400" fill="url(#grid2)"/>
  <rect width="600" height="400" fill="url(#glow2)"/>

  <!-- org chart connecting lines -->
  <line x1="300" y1="150" x2="220" y2="210" stroke="#3a3a3e" stroke-width="2.5"/>
  <line x1="300" y1="150" x2="300" y2="210" stroke="#3a3a3e" stroke-width="2.5"/>
  <line x1="300" y1="150" x2="380" y2="210" stroke="#3a3a3e" stroke-width="2.5"/>

  <!-- lead user (center top) -->
  <g transform="translate(300,120)">
    <circle cx="0" cy="0" r="26" fill="none" stroke="url(#gold2)" stroke-width="4"/>
    <path d="M-24 46 C-24 16 24 16 24 46" fill="none" stroke="url(#gold2)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- three team members -->
  <g transform="translate(220,238)">
    <circle cx="0" cy="0" r="19" fill="none" stroke="#8f8f94" stroke-width="3.5"/>
    <path d="M-18 34 C-18 12 18 12 18 34" fill="none" stroke="#8f8f94" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(300,238)">
    <circle cx="0" cy="0" r="19" fill="none" stroke="#8f8f94" stroke-width="3.5"/>
    <path d="M-18 34 C-18 12 18 12 18 34" fill="none" stroke="#8f8f94" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <g transform="translate(380,238)">
    <circle cx="0" cy="0" r="19" fill="none" stroke="#8f8f94" stroke-width="3.5"/>
    <path d="M-18 34 C-18 12 18 12 18 34" fill="none" stroke="#8f8f94" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <line x1="130" y1="300" x2="470" y2="300" stroke="#26262a" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="300" y="340" text-anchor="middle" font-family="Poppins, sans-serif" font-size="15" letter-spacing="4"
        fill="#d4af37" opacity="0.85">PEOPLE · PAYROLL · ATTENDANCE</text>
</svg>
