<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="gold1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2d574"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="url(#bg1)"/>
  <rect width="600" height="400" fill="url(#grid1)"/>
  <rect width="600" height="400" fill="url(#glow1)"/>

  <!-- hanger rail -->
  <line x1="90" y1="118" x2="510" y2="118" stroke="#3a3a3e" stroke-width="3"/>

  <!-- three hanging garments (t-shirt silhouette) -->
  <g>
    <!-- garment 1 -->
    <g transform="translate(190,118) scale(0.8)">
      <path d="M0 0 L0 -14" stroke="#8a8a8f" stroke-width="3.5" fill="none"/>
      <circle cx="0" cy="-16" r="3.5" fill="#8a8a8f"/>
      <path d="M-11 0 C-5 11 5 11 11 0 L29 0 L50 24 L33 39 L29 31 L29 108 L-29 108 L-29 31 L-33 39 L-50 24 Z"
            fill="none" stroke="url(#gold1)" stroke-width="3.8" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <!-- garment 2 (center, larger) -->
    <g transform="translate(300,118) scale(1)">
      <path d="M0 0 L0 -14" stroke="#8a8a8f" stroke-width="3.5" fill="none"/>
      <circle cx="0" cy="-16" r="3.5" fill="#8a8a8f"/>
      <path d="M-11 0 C-5 11 5 11 11 0 L29 0 L50 24 L33 39 L29 31 L29 108 L-29 108 L-29 31 L-33 39 L-50 24 Z"
            fill="none" stroke="url(#gold1)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <!-- garment 3 -->
    <g transform="translate(410,118) scale(0.8)">
      <path d="M0 0 L0 -14" stroke="#8a8a8f" stroke-width="3.5" fill="none"/>
      <circle cx="0" cy="-16" r="3.5" fill="#8a8a8f"/>
      <path d="M-11 0 C-5 11 5 11 11 0 L29 0 L50 24 L33 39 L29 31 L29 108 L-29 108 L-29 31 L-33 39 L-50 24 Z"
            fill="none" stroke="#6a6a6f" stroke-width="3.8" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
  </g>

  <!-- stitch line accent -->
  <line x1="130" y1="300" x2="470" y2="300" stroke="#26262a" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="300" y="340" text-anchor="middle" font-family="Poppins, sans-serif" font-size="15" letter-spacing="4"
        fill="#d4af37" opacity="0.85">RMG · PRODUCTION · ERP</text>
</svg>
