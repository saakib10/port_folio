<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </linearGradient>
    <linearGradient id="gold5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2d574"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <radialGradient id="glow5" cx="50%" cy="32%" r="60%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid5" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <rect width="600" height="400" fill="url(#bg5)"/>
  <rect width="600" height="400" fill="url(#grid5)"/>
  <rect width="600" height="400" fill="url(#glow5)"/>

  <!-- spinning frame rail -->
  <line x1="90" y1="128" x2="510" y2="128" stroke="#3a3a3e" stroke-width="3"/>

  <!-- yarn cones/bobbins on the rail -->
  <g>
    <!-- cone 1 -->
    <g transform="translate(190,128)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#8a8a8f" stroke-width="3"/>
      <path d="M-15 10 L15 10 L9 92 L-9 92 Z" fill="none" stroke="#6a6a6f" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M-11 26 Q0 32 11 26 M-10 42 Q0 48 10 42 M-9.5 58 Q0 64 9.5 58 M-9 74 Q0 80 9 74"
            fill="none" stroke="#4a4a4e" stroke-width="1.6"/>
    </g>
    <!-- cone 2 (center, gold / highlighted) -->
    <g transform="translate(300,128)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#8a8a8f" stroke-width="3.4"/>
      <path d="M-19 12 L19 12 L11 112 L-11 112 Z" fill="none" stroke="url(#gold5)" stroke-width="3.8" stroke-linejoin="round"/>
      <path d="M-14 32 Q0 39 14 32 M-13 51 Q0 58 13 51 M-12 70 Q0 77 12 70 M-11.5 89 Q0 96 11.5 89"
            fill="none" stroke="url(#gold5)" stroke-width="1.8" opacity="0.75"/>
    </g>
    <!-- cone 3 -->
    <g transform="translate(410,128)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#8a8a8f" stroke-width="3"/>
      <path d="M-15 10 L15 10 L9 92 L-9 92 Z" fill="none" stroke="#6a6a6f" stroke-width="3.2" stroke-linejoin="round"/>
      <path d="M-11 26 Q0 32 11 26 M-10 42 Q0 48 10 42 M-9.5 58 Q0 64 9.5 58 M-9 74 Q0 80 9 74"
            fill="none" stroke="#4a4a4e" stroke-width="1.6"/>
    </g>
  </g>

  <line x1="130" y1="300" x2="470" y2="300" stroke="#26262a" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="300" y="340" text-anchor="middle" font-family="Poppins, sans-serif" font-size="15" letter-spacing="4"
        fill="#d4af37" opacity="0.85">SPINNING · YARN · PRODUCTION</text>
</svg>
